name: ERP-MES Integration Test Pipeline

# 1. 실행 조건 수정: '251018_태영_통합테스트환경' 브랜치에 푸시 또는 PR 발생 시 실행
on:
  push:
    branches: [ 251018_태영_통합테스트환경 ]
  pull_request:
    branches: [ 251018_태영_통합테스트환경 ]

env:
  # 프로젝트의 ERP 모듈 디렉토리 경로 (루트 기준)
  ERP_SERVER_DIR: erp-server
  
jobs:
  integration-test:
    name: E2E Integration Test (ERP <-> MES)
    runs-on: ubuntu-latest

    steps:
    # 1. 코드 체크아웃
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Java 환경 설정 (Java 17, Gradle 캐시 사용)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle' 

    # 3. Gradle Wrapper 권한 부여 (필수)
    - name: Grant Execute Permission for gradlew
      run: chmod +x ./${{ env.ERP_SERVER_DIR }}/gradlew 

    # 4. 핵심 통합 테스트 실행 및 리포트 생성
    - name: Run Integration Tests in ERP Server
      # ERP 서버 디렉토리로 이동하지 않고 루트에서 실행하여 모듈별 테스트 실행
      run: ./gradlew test --project-dir ${{ env.ERP_SERVER_DIR }}
      # OR run: ./gradlew :erp-server:test (멀티 모듈 구성에 따라 다름. 위의 명령이 더 일반적)
      
    # 5. 테스트 결과 아티팩트 저장 (JUnit XML)
    - name: Upload Test Results (JUnit XML)
      uses: actions/upload-artifact@v4
      with:
        name: erp-integration-test-reports
        path: ${{ env.ERP_SERVER_DIR }}/build/test-results/test/*.xml 
      
    # 6. 테스트 결과 요약 (품질 지표 증거 확보)
    - name: Publish Test Report Summary
      uses: mikepenz/action-junit-report@v4
      if: always() # 빌드/테스트 실패 여부와 관계없이 리포트 요약 실행
      with:
        report_paths: ${{ env.ERP_SERVER_DIR }}/build/test-results/test/*.xml